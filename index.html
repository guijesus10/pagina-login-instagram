<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="instagram-wrapper">
        <div class="instagram-phone">
            <img src="img/iphone.png" alt="celular">
        </div>

        <div class="instagram-right">
            <div class="instagram-continue">
                <div class="group">
                    <img src="img/Instagram-Logo-2016-Presente.png" class="instagram_logo" alt="logo do instagram">
                    <div class="profile-img">
                        <img src="img/profile-img.jpeg" alt="imagem de perfil">
                    </div>
                    <a href="#" class="instagram-login">Continue como _gui.jesus</a>
                    <a href="#" class="instagram-logout">Remover conta</a>
                </div>
                <div class="group">
                    <p class="not-account">Não é _gui.jesus?</p>
                    <p class="not-account">
                        <span class="link-blue">Alternar contas</span>
                        or
                        <span class="link-blue">Inscreva-se</span>
                    </p>
                </div>
            </div>

            <div class="get-the-app">
                <p class="get-app">Baixe o aplicativo.</p>
                <div class="download">
                    <a href="#" class="app-download"><img src="img/play-store.png" alt="Google Play"></a>
                    <a href="#" class="app-download"><img src="img/app-store.png" alt="App Store"></a>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
